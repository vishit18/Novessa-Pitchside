<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1014" />
    <meta
      name="description"
      content="Same match. Your story. A synthetic football match told differently to every viewer, with every number checked."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Novessa Pitchside</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Set the theme before the first paint so dark mode does not flash white.
      try {
        var t = localStorage.getItem('novessa-theme')
        if (t !== 'dark' && t !== 'light')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

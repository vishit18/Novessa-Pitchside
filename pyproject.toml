[project]
name = "novessa-pitchside"
version = "0.1.0"
description = "Same match. Your story. Personalised, verified match overlays from a synthetic football league."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "agent-framework-core>=1.22.0",
    "azure-identity>=1.26.0",
    "mcp>=1.2",
    "httpx>=0.28.1",
    "a2a-sdk>=1.2.3",
    "azure-eventhub>=5.15.1",
    "azure-cosmos>=4.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

# Offline auto-eventing on real footage (vision/). Kept out of the default install so the
# deployed API image stays small. Install with: uv sync --group vision
# All permissively licensed: no Ultralytics YOLO (AGPL), see docs/06.
vision = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.56",
    "opencv-python-headless>=4.10",
    "scipy>=1.14",
    "ijson>=3.3",
    "pillow>=10.4",
]

[tool.uv]
package = false

# The default PyTorch wheels on Windows are CPU only. This index carries CUDA 12.8 builds,
# which the RTX 50 series (Blackwell) needs.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["footage"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["footage/", "frontend/"]

[[tool.mypy.overrides]]
# Heavy vision-only packages without complete type information.
module = ["cv2.*", "scipy.*", "torch.*", "torchvision.*", "transformers.*", "ijson.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# OpenCV, SciPy and PyTorch return untyped arrays. The rest of the repo stays strict.
module = ["vision.*", "scripts.prepare_footage"]
warn_return_any = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "engine", "vision/tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# Non-Latin digits are the point of these tests.
"backend/tests/test_localise_voice.py" = ["RUF001"]
